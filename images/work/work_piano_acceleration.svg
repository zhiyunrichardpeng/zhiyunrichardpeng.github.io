<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradC7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f" />
      <stop offset="50%" stop-color="#0d2b3a" />
      <stop offset="100%" stop-color="#091e2b" />
    </linearGradient>
    <linearGradient id="pianoKeyGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="neuralGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="gridC7" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e3a5f" stroke-width="0.8" stroke-opacity="0.35"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGradC7)" />
  <rect width="800" height="450" fill="url(#gridC7)" />

  <!-- Badge / Tag -->
  <rect x="30" y="25" width="260" height="30" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.2"/>
  <text x="160" y="45" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">PROJ-C7 • NEURAL ACCELERATION</text>

  <!-- Status Chip: Real-Time Latency -->
  <rect x="610" y="25" width="160" height="30" rx="6" fill="#0f2b38" stroke="#38bdf8" stroke-width="1.2"/>
  <circle cx="628" cy="40" r="5" fill="#10b981" filter="url(#glow)"/>
  <text x="696" y="45" fill="#e0f2fe" font-family="monospace" font-size="12" font-weight="600" text-anchor="middle">&lt; 1.8ms Latency</text>

  <!-- Main Architecture Container -->
  <!-- 1. Left: Piano Key Interface Trigger -->
  <g transform="translate(45, 95)">
    <!-- Interface Label -->
    <text x="95" y="20" fill="#67e8f9" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Piano-Style Key Interface</text>
    <text x="95" y="38" fill="#94a3b8" font-family="sans-serif" font-size="10.5" text-anchor="middle">Polyphonic Expression Triggers</text>

    <!-- Piano Keyboard Graphic -->
    <g transform="translate(15, 55)">
      <!-- Base keyboard plate -->
      <rect x="0" y="0" width="160" height="190" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2"/>
      
      <!-- White Keys -->
      <rect x="8" y="10" width="26" height="170" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="36" y="10" width="26" height="170" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="64" y="10" width="26" height="170" rx="3" fill="url(#pianoKeyGlow)" stroke="#10b981" stroke-width="2" filter="url(#glow)"/>
      <rect x="92" y="10" width="26" height="170" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="120" y="10" width="26" height="170" rx="3" fill="url(#pianoKeyGlow)" stroke="#10b981" stroke-width="2" filter="url(#glow)"/>

      <!-- Black Keys -->
      <rect x="25" y="10" width="16" height="105" rx="2" fill="#0f172a" />
      <rect x="53" y="10" width="16" height="105" rx="2" fill="#0f172a" />
      <rect x="109" y="10" width="16" height="105" rx="2" fill="#0f172a" />

      <!-- Active Key Indicator / Ripples -->
      <circle cx="77" cy="155" r="7" fill="#ffffff" />
      <circle cx="133" cy="155" r="7" fill="#ffffff" />
      <text x="77" y="140" fill="#065f46" font-family="sans-serif" font-weight="bold" font-size="9" text-anchor="middle">AU1</text>
      <text x="133" y="140" fill="#065f46" font-family="sans-serif" font-weight="bold" font-size="9" text-anchor="middle">AU12</text>
    </g>

    <!-- Signal Stream Arrows -->
    <path d="M 185,150 C 215,150 215,150 240,150" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-dasharray="6,4"/>
    <circle cx="240" cy="150" r="4" fill="#10b981"/>
  </g>

  <!-- 2. Middle: Learning-Based Acceleration / Deep Surrogate Network -->
  <g transform="translate(300, 95)">
    <!-- Neural Net Panel Container -->
    <rect x="0" y="0" width="240" height="265" rx="10" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.8" />
    <rect x="0" y="0" width="240" height="32" rx="10" fill="#1e293b" />
    <text x="120" y="21" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Deep Surrogate Acceleration Core</text>

    <!-- Neural Network Layers (Input -> Hidden -> Output) -->
    <!-- Synaptic Connections -->
    <g stroke="url(#neuralGrad)" stroke-width="1.2" opacity="0.45">
      <!-- Input to Hidden 1 -->
      <line x1="35" y1="70" x2="95" y2="60" />
      <line x1="35" y1="70" x2="95" y2="105" />
      <line x1="35" y1="70" x2="95" y2="150" />
      <line x1="35" y1="115" x2="95" y2="60" />
      <line x1="35" y1="115" x2="95" y2="105" />
      <line x1="35" y1="115" x2="95" y2="150" />
      <line x1="35" y1="160" x2="95" y2="105" />
      <line x1="35" y1="160" x2="95" y2="150" />
      <line x1="35" y1="160" x2="95" y2="195" />
      <line x1="35" y1="205" x2="95" y2="150" />
      <line x1="35" y1="205" x2="95" y2="195" />

      <!-- Hidden 1 to Hidden 2 -->
      <line x1="95" y1="60" x2="150" y2="75" />
      <line x1="95" y1="60" x2="150" y2="125" />
      <line x1="95" y1="105" x2="150" y2="75" />
      <line x1="95" y1="105" x2="150" y2="125" />
      <line x1="95" y1="105" x2="150" y2="175" />
      <line x1="95" y1="150" x2="150" y2="125" />
      <line x1="95" y1="150" x2="150" y2="175" />
      <line x1="95" y1="195" x2="150" y2="175" />

      <!-- Hidden 2 to Output -->
      <line x1="150" y1="75" x2="205" y2="85" />
      <line x1="150" y1="75" x2="205" y2="135" />
      <line x1="150" y1="125" x2="205" y2="85" />
      <line x1="150" y1="125" x2="205" y2="135" />
      <line x1="150" y1="125" x2="205" y2="185" />
      <line x1="150" y1="175" x2="205" y2="135" />
      <line x1="150" y1="175" x2="205" y2="185" />
    </g>

    <!-- Node circles Layer 1: Input -->
    <circle cx="35" cy="70" r="7" fill="#10b981" filter="url(#glow)"/>
    <circle cx="35" cy="115" r="7" fill="#10b981" />
    <circle cx="35" cy="160" r="7" fill="#10b981" filter="url(#glow)"/>
    <circle cx="35" cy="205" r="7" fill="#10b981" />

    <!-- Layer 2: Hidden 1 -->
    <circle cx="95" cy="60" r="6" fill="#38bdf8" />
    <circle cx="95" cy="105" r="6" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="95" cy="150" r="6" fill="#38bdf8" />
    <circle cx="95" cy="195" r="6" fill="#38bdf8" filter="url(#glow)"/>

    <!-- Layer 3: Hidden 2 (Latent Representation) -->
    <circle cx="150" cy="75" r="6" fill="#818cf8" filter="url(#glow)"/>
    <circle cx="150" cy="125" r="6" fill="#818cf8" />
    <circle cx="150" cy="175" r="6" fill="#818cf8" filter="url(#glow)"/>

    <!-- Layer 4: Output (Muscle Activations / Displacements) -->
    <circle cx="205" cy="85" r="7" fill="#ec4899" filter="url(#glow)"/>
    <circle cx="205" cy="135" r="7" fill="#ec4899" filter="url(#glow)"/>
    <circle cx="205" cy="185" r="7" fill="#ec4899" />

    <!-- Sub labels -->
    <text x="35" y="235" fill="#94a3b8" font-family="sans-serif" font-size="8.5" text-anchor="middle">Keys</text>
    <text x="122" y="235" fill="#94a3b8" font-family="sans-serif" font-size="8.5" text-anchor="middle">Latent Physics</text>
    <text x="205" y="235" fill="#94a3b8" font-family="sans-serif" font-size="8.5" text-anchor="middle">Dynamics</text>
    <text x="120" y="254" fill="#a5f3fc" font-family="monospace" font-size="9" text-anchor="middle">Speedup: 45× over raw FEM</text>
  </g>

  <!-- 3. Right: Real-Time Biomechanical Face Deformation -->
  <g transform="translate(560, 95)">
    <text x="100" y="20" fill="#a855f7" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Zero-Latency Face Output</text>
    <text x="100" y="38" fill="#94a3b8" font-family="sans-serif" font-size="10.5" text-anchor="middle">Interactive 60 FPS Synthesis</text>

    <!-- Face Visualizer Box -->
    <g transform="translate(10, 55)">
      <rect x="0" y="0" width="180" height="190" rx="8" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.8"/>
      
      <!-- Stylized Facial Contour & Muscle Vectors -->
      <ellipse cx="90" cy="85" rx="55" ry="68" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3,3" />
      
      <!-- Eyebrows with active upward deformation vectors -->
      <path d="M 55,60 Q 68,48 80,56" fill="none" stroke="#38bdf8" stroke-width="2.5" />
      <path d="M 100,56 Q 112,48 125,60" fill="none" stroke="#38bdf8" stroke-width="2.5" />
      <line x1="68" y1="52" x2="68" y2="40" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)" />
      <line x1="112" y1="52" x2="112" y2="40" stroke="#10b981" stroke-width="2" />

      <!-- Eyes -->
      <circle cx="68" cy="72" r="5" fill="#38bdf8" />
      <circle cx="112" cy="72" r="5" fill="#38bdf8" />

      <!-- Smile Mouth with AU12 Corner Vectors -->
      <path d="M 60,118 Q 90,140 120,118" fill="none" stroke="#f43f5e" stroke-width="3" />
      <line x1="60" y1="118" x2="48" y2="108" stroke="#ec4899" stroke-width="2" />
      <line x1="120" y1="118" x2="132" y2="108" stroke="#ec4899" stroke-width="2" />

      <!-- Volume preservation badge -->
      <rect x="18" y="150" width="144" height="24" rx="4" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
      <text x="90" y="166" fill="#c7d2fe" font-family="monospace" font-size="9" text-anchor="middle">Vol. Error: &lt; 0.12%</text>
    </g>
  </g>

  <!-- Flow Arrows connecting components -->
  <g stroke="#38bdf8" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M 245,210 L 290,210" marker-end="url(#arrow)" />
    <path d="M 545,210 L 565,210" marker-end="url(#arrow)" />
  </g>

  <!-- Footer Pipeline Description -->
  <rect x="45" y="385" width="710" height="42" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="400" y="411" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" text-anchor="middle">
    <strong>Scientific Machine Learning Pipeline:</strong> Keystroke Trigger &rarr; Physics-Informed Neural Surrogate &rarr; Real-Time Multi-Layer Soft-Tissue Facial Deformation
  </text>
</svg>
