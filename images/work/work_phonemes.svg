<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradPhoneme" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#6ee7b7" />
    </linearGradient>
  </defs>
  
  <rect width="800" height="450" fill="url(#bgGradPhoneme)" />
  
  <rect x="30" y="25" width="240" height="28" rx="6" fill="#065f46" stroke="#10b981" stroke-width="1.2"/>
  <text x="150" y="44" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">PROJ-B2B • INDIGENOUS PHONEMES</text>
  
  <!-- Waveform + Articulatory Lip Contours & Energy Parsimony -->
  <g transform="translate(100, 180)">
    <!-- Audio Waveform -->
    <path d="M 0,20 Q 30,-60 60,30 T 120,10 T 180,-80 T 240,60 T 300,0 T 360,-40 T 420,30 T 480,-10 T 540,20 T 600,0" fill="none" stroke="url(#waveGrad)" stroke-width="3" />
    
    <!-- Spectrogram Bars Inset -->
    <g transform="translate(0, 50)" opacity="0.7">
      <rect x="10" y="10" width="16" height="35" rx="3" fill="#34d399" />
      <rect x="35" y="0" width="16" height="45" rx="3" fill="#10b981" />
      <rect x="60" y="18" width="16" height="27" rx="3" fill="#059669" />
      <rect x="85" y="5" width="16" height="40" rx="3" fill="#34d399" />
      <rect x="110" y="25" width="16" height="20" rx="3" fill="#6ee7b7" />
      <rect x="135" y="0" width="16" height="45" rx="3" fill="#10b981" />
      <rect x="160" y="12" width="16" height="33" rx="3" fill="#34d399" />
      <rect x="185" y="8" width="16" height="37" rx="3" fill="#6ee7b7" />
    </g>
    
    <!-- Articulatory Vocal Tract & Lip Contours -->
    <g transform="translate(420, -50)">
      <rect width="200" height="150" rx="10" fill="#042f2e" stroke="#0d9488" stroke-width="1.5" />
      <text x="20" y="30" fill="#99f6e4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="700">LIP &amp; ORAL CONTOUR /θ/, /ɬ/</text>
      
      <!-- Lip profile cross section -->
      <path d="M 40,80 C 60,60 90,65 110,80 C 130,95 160,85 170,80" fill="none" stroke="#2dd4bf" stroke-width="2.5" />
      <ellipse cx="105" cy="80" rx="18" ry="12" fill="#14b8a6" fill-opacity="0.3" stroke="#2dd4bf" stroke-width="2" />
      
      <!-- Muscle activation direction -->
      <path d="M 85,55 L 105,70" stroke="#f43f5e" stroke-width="2" marker-end="url(#arrow)" />
      <path d="M 125,55 L 105,70" stroke="#f43f5e" stroke-width="2" marker-end="url(#arrow)" />
      <text x="105" y="125" fill="#5eead4" font-family="monospace" font-size="10" text-anchor="middle">Orbicularis Oris: 0.84</text>
    </g>
  </g>
  
  <text x="40" y="415" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="700">Speech Coarticulation &amp; Indigenous Phoneme Modeling</text>
  <text x="40" y="435" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13">Acoustic-to-articulatory kinematic mapping via biomechanical energy parsimony</text>
</svg>
