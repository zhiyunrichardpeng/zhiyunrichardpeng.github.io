<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradMri" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05131e" />
      <stop offset="100%" stop-color="#0a2540" />
    </linearGradient>
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0.2"/>
    </linearGradient>
    <pattern id="mriGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#133e5e" stroke-width="0.5" stroke-opacity="0.3"/>
    </pattern>
  </defs>
  
  <rect width="800" height="450" fill="url(#bgGradMri)" />
  <rect width="800" height="450" fill="url(#mriGrid)" />
  
  <rect x="30" y="25" width="200" height="28" rx="6" fill="#083344" stroke="#06b6d4" stroke-width="1.2"/>
  <text x="130" y="44" fill="#a5f3fc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">PROJ-B1 • MRI GROUND TRUTH</text>
  
  <!-- MRI Scan profile and multi-layer tissue segmentation -->
  <g transform="translate(380, 220)">
    <!-- Skull Cranial Outline -->
    <path d="M -90,-110 C -40,-130 80,-130 110,-70 C 130,-30 135,20 120,60 C 105,95 80,120 40,140 C -10,160 -60,150 -80,110 Z" fill="#0f2b3e" stroke="#38bdf8" stroke-width="2.5" opacity="0.6"/>
    
    <!-- Sagittal Facial Profile Outline -->
    <path d="M 40,-120 C 70,-100 130,-80 145,-40 C 150,-20 145,-5 165,10 C 175,18 160,35 150,42 C 160,55 152,70 140,78 C 120,95 90,140 30,165" fill="none" stroke="#22d3ee" stroke-width="3"/>
    
    <!-- Tissue Layers: Muscle, Fat, Skin -->
    <path d="M 50,-100 C 75,-80 120,-60 132,-30 C 135,-15 130,0 148,15 C 152,25 140,40 135,48 C 142,60 135,70 125,75" fill="none" stroke="#f43f5e" stroke-width="4" stroke-dasharray="2,2" opacity="0.8"/>
    <text x="160" y="-30" fill="#f43f5e" font-family="monospace" font-size="10">Subcutaneous Fat</text>
    <text x="175" y="15" fill="#22d3ee" font-family="monospace" font-size="10">Epidermis</text>
    <text x="150" y="55" fill="#fbbf24" font-family="monospace" font-size="10">Zygomaticus Major</text>
    
    <!-- Crosshairs & Measurement points -->
    <circle cx="145" cy="-40" r="4" fill="#22d3ee" />
    <circle cx="165" cy="10" r="4" fill="#22d3ee" />
    <circle cx="150" cy="42" r="4" fill="#22d3ee" />
    
    <line x1="80" y1="10" x2="165" y2="10" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="3,3" />
    <text x="95" y="5" fill="#fef08a" font-family="monospace" font-size="9">Δx = 12.4mm</text>
    
    <!-- Scanning Beam overlay -->
    <rect x="-140" y="-130" width="280" height="4" fill="#38bdf8" opacity="0.8" filter="drop-shadow(0 0 8px #38bdf8)">
      <animate attributeName="y" values="-130;160;-130" dur="4s" repeatCount="indefinite" />
    </rect>
  </g>
  
  <text x="40" y="415" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="700">MRI Anatomical Ground Truth &amp; Volumetric Segmentation</text>
  <text x="40" y="435" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13">High-resolution in vivo scan registration for multi-layer soft-tissue deformation</text>
</svg>
