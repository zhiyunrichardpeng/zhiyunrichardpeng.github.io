<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradAsset" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#292524" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  
  <rect width="800" height="450" fill="url(#bgGradAsset)" />
  
  <rect x="30" y="25" width="220" height="28" rx="6" fill="#78350f" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="140" y="44" fill="#fef3c7" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">PROJ-B3 • 3D ASSET &amp; REGISTRATION</text>
  
  <!-- Topology wireframe face + auto-rigging bones -->
  <g transform="translate(400, 215)">
    <!-- Low-poly vs High-res quad wireframe face mesh -->
    <ellipse cx="0" cy="10" rx="140" ry="160" fill="#44403c" stroke="#f59e0b" stroke-width="2" />
    
    <!-- Quad subdivisions -->
    <path d="M 0,-150 L 0,170" stroke="#fbbf24" stroke-width="1.5" />
    <path d="M -140,10 L 140,10" stroke="#fbbf24" stroke-width="1.5" />
    <path d="M -120,-60 L 120,-60" stroke="#d97706" stroke-width="1" stroke-dasharray="2,2"/>
    <path d="M -120,70 L 120,70" stroke="#d97706" stroke-width="1" stroke-dasharray="2,2"/>
    <path d="M -70,-140 L -70,160" stroke="#d97706" stroke-width="1" stroke-dasharray="2,2"/>
    <path d="M 70,-140 L 70,160" stroke="#d97706" stroke-width="1" stroke-dasharray="2,2"/>
    
    <!-- Eye Orbits Quad Loops -->
    <ellipse cx="-45" cy="-25" rx="28" ry="18" fill="none" stroke="#f59e0b" stroke-width="2" />
    <ellipse cx="45" cy="-25" rx="28" ry="18" fill="none" stroke="#f59e0b" stroke-width="2" />
    
    <!-- Mouth Quad Loop -->
    <ellipse cx="0" cy="65" rx="40" ry="22" fill="none" stroke="#f59e0b" stroke-width="2" />
    
    <!-- Musculoskeletal Anchor Guides (Red dots) -->
    <circle cx="-55" cy="60" r="5" fill="#ef4444" />
    <circle cx="55" cy="60" r="5" fill="#ef4444" />
    <circle cx="-100" cy="-20" r="5" fill="#ef4444" />
    <circle cx="100" cy="-20" r="5" fill="#ef4444" />
    <line x1="-100" y1="-20" x2="-55" y2="60" stroke="#ef4444" stroke-width="2" stroke-dasharray="3,3" />
    <line x1="100" y1="-20" x2="55" y2="60" stroke="#ef4444" stroke-width="2" stroke-dasharray="3,3" />
    
    <!-- Registration Tag overlay -->
    <g transform="translate(130, -130)">
      <rect width="180" height="75" rx="8" fill="#1c1917" stroke="#78350f" stroke-width="1.2" />
      <text x="15" y="25" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="700">AUTO-REGISTRATION</text>
      <text x="15" y="45" fill="#a8a29e" font-family="monospace" font-size="10">Landmarks: 68/68 matched</text>
      <text x="15" y="60" fill="#a8a29e" font-family="monospace" font-size="10">Topology: Quad Manifold</text>
    </g>
  </g>
  
  <text x="40" y="415" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="700">Automated 3D Facial Asset Generation &amp; Topology Registration</text>
  <text x="40" y="435" fill="#fef3c7" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13">Standardized volumetric meshing, muscle insertion mapping &amp; skin-proxy coupling</text>
</svg>
