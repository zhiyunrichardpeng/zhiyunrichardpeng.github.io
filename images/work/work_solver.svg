<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="meshGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.7" stroke-opacity="0.4"/>
    </pattern>
  </defs>
  
  <rect width="800" height="450" fill="url(#bgGrad)" />
  <rect width="800" height="450" fill="url(#grid)" />
  
  <!-- Tag -->
  <rect x="30" y="25" width="150" height="28" rx="6" fill="#312e81" stroke="#6366f1" stroke-width="1.2"/>
  <text x="105" y="44" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">PROJ-B5 • SOLVER</text>
  
  <!-- Simulation tetrahedral wireframe & stress map -->
  <g transform="translate(400, 230)">
    <!-- Stress gradient contour shapes -->
    <ellipse cx="0" cy="10" rx="220" ry="110" fill="#6366f1" opacity="0.12" filter="blur(20px)" />
    
    <!-- 3D FEM Grid Lines -->
    <path d="M -180,60 L -90,-80 L 80,-90 L 190,50 L 90,130 L -100,120 Z" fill="none" stroke="#60a5fa" stroke-width="1.8" stroke-dasharray="4,3" opacity="0.6"/>
    <path d="M -90,-80 L 0,20 L 80,-90" fill="none" stroke="#818cf8" stroke-width="2"/>
    <path d="M -180,60 L 0,20 L 190,50" fill="none" stroke="#818cf8" stroke-width="2"/>
    <path d="M -100,120 L 0,20 L 90,130" fill="none" stroke="#818cf8" stroke-width="2"/>
    
    <!-- Subdivided Strain Elements -->
    <polygon points="-90,-80 0,20 -180,60" fill="url(#meshGrad)" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1.5" />
    <polygon points="0,20 80,-90 -90,-80" fill="url(#meshGrad)" fill-opacity="0.35" stroke="#818cf8" stroke-width="1.5" />
    <polygon points="0,20 190,50 80,-90" fill="url(#meshGrad)" fill-opacity="0.45" stroke="#c084fc" stroke-width="1.5" />
    <polygon points="0,20 90,130 190,50" fill="url(#meshGrad)" fill-opacity="0.55" stroke="#f43f5e" stroke-width="1.5" />
    <polygon points="-100,120 0,20 90,130" fill="url(#meshGrad)" fill-opacity="0.35" stroke="#e879f9" stroke-width="1.5" />
    <polygon points="-180,60 -100,120 0,20" fill="url(#meshGrad)" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1.5" />
    
    <!-- Nodes -->
    <circle cx="0" cy="20" r="6" fill="#f8fafc" stroke="#38bdf8" stroke-width="2.5" />
    <circle cx="-180" cy="60" r="4.5" fill="#38bdf8" />
    <circle cx="-90" cy="-80" r="4.5" fill="#818cf8" />
    <circle cx="80" cy="-90" r="4.5" fill="#c084fc" />
    <circle cx="190" cy="50" r="5" fill="#f43f5e" />
    <circle cx="90" cy="130" r="4.5" fill="#f43f5e" />
    <circle cx="-100" cy="120" r="4.5" fill="#38bdf8" />
    
    <!-- Real-time convergence plot overlay -->
    <g transform="translate(140, -140)">
      <rect width="180" height="90" rx="8" fill="#0f172a" fill-opacity="0.85" stroke="#475569" stroke-width="1" />
      <text x="15" y="22" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10" font-weight="600">XPBD RESIDUAL CONVERGENCE</text>
      <path d="M 20,70 Q 50,68 80,45 T 160,28" fill="none" stroke="#22c55e" stroke-width="2" />
      <text x="150" y="80" fill="#22c55e" font-family="monospace" font-size="10" text-anchor="end">&lt; 1e-5 s</text>
    </g>
  </g>
  
  <text x="40" y="415" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="700">XPBD / FEM Physical Soft-Tissue Simulator</text>
  <text x="40" y="435" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13">Non-linear hyperelastic constitutive strain &amp; volume-preserving solver</text>
</svg>
