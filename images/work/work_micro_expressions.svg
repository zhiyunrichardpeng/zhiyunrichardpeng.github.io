<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradMicro" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180d2b" />
      <stop offset="100%" stop-color="#2c124d" />
    </linearGradient>
    <radialGradient id="heatGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#8b5cf6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <rect width="800" height="450" fill="url(#bgGradMicro)" />
  
  <rect x="30" y="25" width="230" height="28" rx="6" fill="#4c1d95" stroke="#a855f7" stroke-width="1.2"/>
  <text x="145" y="44" fill="#f3e8ff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">PROJ-B2A • MICRO-EXPRESSIONS</text>
  
  <!-- Face landmark graph with high-frequency heatmaps & wrinkle vectors -->
  <g transform="translate(400, 215)">
    <!-- Heatmap zones around eyes and brow -->
    <ellipse cx="-80" cy="-45" rx="60" ry="30" fill="url(#heatGlow)" />
    <ellipse cx="80" cy="-45" rx="60" ry="30" fill="url(#heatGlow)" />
    <ellipse cx="0" cy="50" rx="70" ry="35" fill="url(#heatGlow)" />
    
    <!-- Facial contour mesh (frontal) -->
    <path d="M 0,-110 C -120,-110 -140,-20 -130,40 C -120,90 -60,135 0,145 C 60,135 120,90 130,40 C 140,-20 120,-110 0,-110 Z" fill="none" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="3,3" opacity="0.6"/>
    
    <!-- Brows with dynamic wrinkle vectors -->
    <path d="M -90,-55 Q -60,-75 -30,-60" fill="none" stroke="#f43f5e" stroke-width="3" />
    <path d="M 30,-60 Q 60,-75 90,-55" fill="none" stroke="#f43f5e" stroke-width="3" />
    
    <!-- Micro-wrinkle vector spikes -->
    <line x1="-65" y1="-70" x2="-68" y2="-85" stroke="#f472b6" stroke-width="2" />
    <line x1="-55" y1="-72" x2="-55" y2="-88" stroke="#f472b6" stroke-width="2" />
    <line x1="-45" y1="-70" x2="-42" y2="-85" stroke="#f472b6" stroke-width="2" />
    
    <line x1="45" y1="-70" x2="42" y2="-85" stroke="#f472b6" stroke-width="2" />
    <line x1="55" y1="-72" x2="55" y2="-88" stroke="#f472b6" stroke-width="2" />
    <line x1="65" y1="-70" x2="68" y2="-85" stroke="#f472b6" stroke-width="2" />
    
    <!-- Eyes -->
    <path d="M -95,-35 Q -65,-50 -35,-35 Q -65,-20 -95,-35 Z" fill="none" stroke="#c084fc" stroke-width="1.8" />
    <circle cx="-65" cy="-35" r="5" fill="#f43f5e" />
    <path d="M 35,-35 Q 65,-50 95,-35 Q 65,-20 35,-35 Z" fill="none" stroke="#c084fc" stroke-width="1.8" />
    <circle cx="65" cy="-35" r="5" fill="#f43f5e" />
    
    <!-- Nose bridge -->
    <path d="M 0,-50 L 0,0 L -15,15 L 15,15" fill="none" stroke="#a78bfa" stroke-width="1.8" />
    
    <!-- Mouth / Lips with dynamic FACS AU tensor -->
    <path d="M -45,55 Q 0,40 45,55 Q 0,75 -45,55 Z" fill="#ec4899" fill-opacity="0.25" stroke="#f43f5e" stroke-width="2" />
    
    <!-- Displacement vector arrows -->
    <path d="M -115,20 L -140,5" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />
    <path d="M 115,20 L 140,5" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />
    
    <!-- Timing graph inset -->
    <g transform="translate(140, 50)">
      <rect width="180" height="75" rx="8" fill="#0f172a" fill-opacity="0.9" stroke="#6d28d9" stroke-width="1" />
      <text x="15" y="20" fill="#e9d5ff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10" font-weight="600">TRANSIENT DURATION: 180ms</text>
      <path d="M 15,55 Q 40,55 55,25 Q 70,25 90,55 L 165,55" fill="none" stroke="#ec4899" stroke-width="2.2" />
    </g>
  </g>
  
  <text x="40" y="415" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="700">Micro-Expressions &amp; Transient Dynamic Wrinkles</text>
  <text x="40" y="435" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13">High-frequency involuntary motor activation &amp; sub-dermal strain concentration</text>
</svg>
