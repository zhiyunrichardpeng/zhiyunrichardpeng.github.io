<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradDemo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#31104b" />
    </linearGradient>
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>
  
  <rect width="800" height="450" fill="url(#bgGradDemo)" />
  
  <rect x="30" y="25" width="220" height="28" rx="6" fill="#371b58" stroke="#d946ef" stroke-width="1.2"/>
  <text x="140" y="44" fill="#fae8ff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">PROJ-B4 • INTERACTIVE WEB</text>
  
  <!-- Interactive Web Browser Window UI with 3D Face Viewport -->
  <g transform="translate(100, 75)">
    <!-- Browser window container -->
    <rect width="600" height="300" rx="10" fill="#0f172a" stroke="#475569" stroke-width="2" />
    <!-- Browser bar -->
    <rect width="600" height="34" rx="10" fill="#1e293b" />
    <circle cx="20" cy="17" r="5" fill="#ef4444" />
    <circle cx="36" cy="17" r="5" fill="#f59e0b" />
    <circle cx="52" cy="17" r="5" fill="#10b981" />
    <rect x="75" y="7" width="360" height="20" rx="5" fill="#0f172a" />
    <text x="90" y="21" fill="#94a3b8" font-family="monospace" font-size="11">https://beneath-the-skin.ideavibes.app/</text>
    
    <!-- 3D Viewport inside browser -->
    <g transform="translate(20, 50)">
      <!-- 3D Canvas area -->
      <rect width="400" height="230" rx="8" fill="#090d16" stroke="#334155" stroke-width="1" />
      
      <!-- Interactive Face with clickable AU handles -->
      <circle cx="200" cy="115" r="75" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
      <path d="M 160,105 Q 200,90 240,105 Q 200,140 160,105 Z" fill="#ec4899" fill-opacity="0.3" stroke="#f43f5e" stroke-width="1.8" />
      <circle cx="170" cy="85" r="7" fill="#38bdf8" />
      <circle cx="230" cy="85" r="7" fill="#38bdf8" />
      
      <!-- Interactive GUI sliders on the right -->
      <g transform="translate(420, 10)">
        <text x="0" y="15" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="700">FACS CONTROLLERS</text>
        
        <text x="0" y="40" fill="#94a3b8" font-family="sans-serif" font-size="9">AU1: Inner Brow Raiser</text>
        <rect x="0" y="46" width="130" height="6" rx="3" fill="#334155" />
        <rect x="0" y="46" width="90" height="6" rx="3" fill="url(#neonPink)" />
        <circle cx="90" cy="49" r="6" fill="#fff" />
        
        <text x="0" y="75" fill="#94a3b8" font-family="sans-serif" font-size="9">AU12: Lip Corner Puller</text>
        <rect x="0" y="81" width="130" height="6" rx="3" fill="#334155" />
        <rect x="0" y="81" width="110" height="6" rx="3" fill="url(#neonPink)" />
        <circle cx="110" cy="84" r="6" fill="#fff" />
        
        <text x="0" y="110" fill="#94a3b8" font-family="sans-serif" font-size="9">Passive Inertia (Hz)</text>
        <rect x="0" y="116" width="130" height="6" rx="3" fill="#334155" />
        <rect x="0" y="116" width="60" height="6" rx="3" fill="url(#neonPink)" />
        <circle cx="60" cy="119" r="6" fill="#fff" />
        
        <rect x="0" y="150" width="130" height="26" rx="6" fill="#701a75" stroke="#d946ef" stroke-width="1" />
        <text x="65" y="167" fill="#fae8ff" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">CAN-WICS DEMO</text>
      </g>
    </g>
  </g>
  
  <text x="40" y="415" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="700">Interactive Web Simulation &amp; IdeaVibes Demo</text>
  <text x="40" y="435" fill="#f0abfc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13">Real-time browser-based interactive character biomechanics &amp; CAN-WICS posters</text>
</svg>
